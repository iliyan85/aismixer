  geo/profiles/PROVENANCE.md. Values are rounded to 0.01 degree, not surveyed
  harbours, shoreline points or marine waypoints. Routes may cross land.
  W1 IDs 1..16 are fixed catalogue identities, never sampling/population ranks.
