# One nmea_sproxy process is one 1:1 network proxy:
# one local input (UDP or serial) -> one network output (UDPSEC or UDP).
#
# Canonical configuration uses explicit input/output mappings. The deprecated
# top-level endpoint form remains temporarily supported for existing configs.
input:
  type: udp
  listen_ip: '::'
  listen_port: 50000
  # Optional application-level ACL for local UDP senders. Omit for unrestricted.
  # An empty list denies all local UDP packets.
  # allow_from:
  #   - 2001:db8:42::15
  #   - 2001:db8:42::/64

output:
  type: udpsec
  host: 192.0.2.10
  port: 17777
  # Optional outbound source bind. Omit to let the OS choose.
  # source_ip: 192.0.2.20
#
# Inactive local UDP input -> plain UDP output example. Replace the active
# output mapping above; plain UDP is for trusted LAN/VPN environments only.
# output:
#   type: udp
#   host: 192.168.10.20
#   port: 17777
#   source_ip: 192.168.10.15
#
# Inactive Linux serial input example. Replace the active input mapping above.
# The port string is passed unchanged to pySerial; replace <device-id> with the
# receiver-specific value.
# input:
#   type: serial
#   port: /dev/serial/by-id/usb-SRT_Marine_Technology_Ltd._AIS_Virtual_COM_Port_<device-id>-if00
#   baudrate: 38400
#   bytesize: 8
#   parity: N
#   stopbits: 1
#   read_timeout: 1.0
#   reconnect_delay: 5
#   max_line_bytes: 4096
#
# Inactive Windows serial input example. Replace the active input mapping above.
# input:
#   type: serial
#   port: COM4
#   baudrate: 38400
#   bytesize: 8
#   parity: N
#   stopbits: 1
#   read_timeout: 1.0
#   reconnect_delay: 5
#   max_line_bytes: 4096
#
# Inactive serial input -> UDPSEC output example:
#   replace the active input mapping with one serial block and keep the active
#   output.type: udpsec mapping.
#
# Inactive serial input -> plain UDP output example:
#   replace the active input and output mappings with one serial block and this
#   output block.
# output:
#   type: udp
#   host: 192.168.10.20
#   port: 17777
#   source_ip: 192.168.10.15
station_id: boat_001
keepalive_interval: 30
peer_timeout: 90
session_refresh_interval: 0

station_private_key: station_private.pem
remote_public_key: aismixer_public.pem
